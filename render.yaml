services:
  - type: web
    name: karotter-tbot
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm ci && npm run fonts:install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: KAROTTER_API_BASE_URL
        value: https://api.karotter.com/api
      - key: KAROTTER_AUTH_MODE
        value: account
      - key: KAROTTER_IDENTIFIER
        sync: false
      - key: KAROTTER_PASSWORD
        sync: false
      - key: TBOT_USERNAME
        value: tbot
      - key: KAROTTER_OAUTH_BASE_URL
        value: https://api.karotter.com/api/oauth
      - key: KAROTTER_OAUTH_SCOPE
        value: profile offline_access
      - key: KAROTTER_OAUTH_TOKEN_PATH
        value: ./data/oauth.json
      - key: TBOT_TIME_ZONE
        value: Asia/Tokyo
      - key: POLL_INTERVAL_MS
        value: 15000
      - key: POLL_PAGE_LIMIT
        value: 50
      - key: MAX_NOTIFICATIONS_PER_TICK
        value: 10
      - key: HTTP_TIMEOUT_MS
        value: 15000
      - key: KAROTTER_REQUESTS_PER_MINUTE
        value: 55
      - key: AVATAR_ALLOWED_HOSTS
        value: karotter.com,api.karotter.com
      - key: STATE_PATH
        value: ./data/state.json
      - key: ENABLE_POLLING
        value: true
      - key: KAROTTER_OAUTH_CLIENT_ID
        sync: false
      - key: KAROTTER_OAUTH_CLIENT_SECRET
        sync: false
      - key: KAROTTER_OAUTH_REDIRECT_URI
        sync: false
      - key: TBOT_SETUP_SECRET
        sync: false
